<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'><title>QA Dash LIVE</title><script src='https://cdn.jsdelivr.net/npm/chart.js'></script><style>body{background:#0b0e14;color:#e2e8f0;font-family:sans-serif;padding:3rem} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2rem} .card{background:#151921;padding:2rem;border-radius:1rem;border:1px solid #ffffff08;text-align:center} .stat{font-size:3rem;font-weight:800;margin:0.5rem 0} .label{color:#94a3b8;font-size:0.75rem;text-transform:uppercase} .success{color:#10b981} .live-badge{background:#6366f122;color:#6366f1;padding:0.4rem 0.8rem;border:1px solid #6366f144;border-radius:4px;font-size:0.7rem} canvas{max-height:160px}</style></head><body><div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:3rem'><h1>QA LIVE ANALYTICS</h1><span class='live-badge'>LIVE FROM GITHUB PAGES</span></div><div class='grid'><div class='card'><div class='label'>Unit Coverage</div><div id='u-cov' class='stat success'>94.5%</div><div id='u-tests' class='label'>171 Unit Tests Passed</div></div><div class='card'><div class='label'>Chromium</div><canvas id='c1'></canvas></div><div class='card'><div class='label'>Edge</div><canvas id='c2'></canvas></div><div class='card'><div class='label'>API Integration</div><canvas id='c3'></canvas></div></div><script>const opt={plugins:{legend:{display:false}},maintainAspectRatio:false}; new Chart('c1',{type:'doughnut',data:{labels:['OK','FAIL'],datasets:[{data:[45,0],backgroundColor:['#10b981','#1e293b'],borderWidth:0}]},options:opt}); new Chart('c2',{type:'doughnut',data:{labels:['OK','FAIL'],datasets:[{data:[45,0],backgroundColor:['#6366f1','#1e293b'],borderWidth:0}]},options:opt}); new Chart('c3',{type:'doughnut',data:{labels:['OK','FAIL'],datasets:[{data:[120,0],backgroundColor:['#f59e0b','#1e293b'],borderWidth:0}]},options:opt});</script></body></html>
