<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'><title>Dashboard QA</title><script src='https://cdn.jsdelivr.net/npm/chart.js'></script><style>body{font-family:sans-serif;background:#0f172a;color:#f1f5f9;padding:2rem;text-align:center} .status{padding:1rem;background:#10b981;border-radius:2rem;display:inline-block;margin:1rem} .grid{display:grid;grid-template-columns:1fr 1fr;gap:2rem} .card{background:#1e293b;padding:2rem;border-radius:1rem} canvas{max-height:300px}</style></head><body><h1>Dashboard de QA - Tester.com</h1><div class='status'>PIPELINE PASSED</div><div class='grid'><div class='card'><h2>Unit Tests (Vitest)</h2><canvas id='u'></canvas><p>171 Passou / 0 Falhou</p></div><div class='card'><h2>E2E (Playwright)</h2><canvas id='e'></canvas><p>1 Passou / 0 Falhou</p></div></div><script>new Chart('u',{type:'bar',data:{labels:['Pass','Fail'],datasets:[{data:[171,0],backgroundColor:['#10b981','#ef4444']}]}}); new Chart('e',{type:'doughnut',data:{labels:['Pass','Fail'],datasets:[{data:[1,0],backgroundColor:['#10b981','#ef4444']}]}});</script></body></html>
