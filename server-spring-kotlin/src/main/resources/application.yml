server:
  port: ${SERVER_PORT:3001}

spring:
  application:
    name: tester-api-kotlin
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_MIN_16_CHARS}
    expires-in: ${JWT_EXPIRES_IN:1h}
    issuer: ${JWT_ISSUER:tester.com}
    audience: ${JWT_AUDIENCE:tester.com-web}
