name: Selenium E2E Pipeline

on:
  push:
    branches: [main]
    paths:
      - "projects-tests/selenium-e2e/**"
      - "web/**"
      - "server-ts/**"
      - "docker-compose.yml"
      - ".github/workflows/selenium-e2e-pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects-tests/selenium-e2e/**"
      - "web/**"
      - "server-ts/**"
      - "docker-compose.yml"
      - ".github/workflows/selenium-e2e-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  checks: write

jobs:
  selenium-e2e:
    name: Selenium E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23
          cache: maven

      - name: Setup Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1

      - name: Setup Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for backend readiness
        working-directory: web
        run: npx wait-on --timeout 120000 http://127.0.0.1:3001/api/products

      - name: Wait for frontend readiness
        working-directory: web
        run: npx wait-on --timeout 120000 http://127.0.0.1:5174

      - name: Run Selenium login tests
        working-directory: projects-tests/selenium-e2e
        continue-on-error: true
        env:
          browser: ${{ matrix.browser }}
          headless: "true"
          BASE_URL: http://127.0.0.1:5174
          LOGIN_EMAIL: ${{ secrets.SELENIUM_LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.SELENIUM_LOGIN_PASSWORD }}
        run: |
          chmod +x mvnw
          ./mvnw clean test \
            -Dbrowser="${browser}" \
            -Dheadless="${headless}" \
            -Dbase.url="${BASE_URL}" \
            -Dlogin.email="${LOGIN_EMAIL}" \
            -Dlogin.password="${LOGIN_PASSWORD}"

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline@2.34.0

      - name: Generate Allure report
        if: always()
        working-directory: projects-tests/selenium-e2e
        run: allure generate ./allure-results -o ./allure-report --clean
        continue-on-error: true

      - name: List Allure report files
        if: always()
        working-directory: projects-tests/selenium-e2e
        run: |
          ls -la ./
          ls -la ./allure-results
          ls -la target/allure-results
        continue-on-error: true

      - name: Copy Allure report to dashboard
        if: always()
        run: |
          mkdir -p tests-dashboard/reports/selenium-allure-report-${{ matrix.browser }}
          cp -r projects-tests/selenium-e2e/allure-report/. \
            tests-dashboard/reports/selenium-allure-report-${{ matrix.browser }}/

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-allure-report-${{ matrix.browser }}
          path: tests-dashboard/reports/selenium-allure-report-${{ matrix.browser }}/
          if-no-files-found: warn

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-surefire-${{ matrix.browser }}
          path: projects-tests/selenium-e2e/target/surefire-reports/
          if-no-files-found: warn

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop application stack
        if: always()
        run: docker compose down

  # ── Deploy Reports ─────────────────────────────────────────────────────
  deploy:
    name: Deploy Selenium Reports
    needs: [selenium-e2e]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all Selenium artifacts
        uses: actions/download-artifact@v4
        with:
          path: tests-dashboard/reports
        continue-on-error: true

      - name: Reorganize report directories
        run: |
          # download-artifact@v4 sem name cria subpastas com o nome do artefato.
          # Os reports já chegam em tests-dashboard/reports/selenium-allure-report-{browser}/
          for browser in chrome firefox; do
            DEST="tests-dashboard/reports/selenium-allure-report-${browser}"
            mkdir -p "$DEST"
            echo "Contents of $DEST:"
            ls "$DEST" || echo "(empty)"
          done

      - name: Deploy to GitHub Pages
        id: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: tests-dashboard
          publish_branch: gh-pages
          destination_dir: tests-dashboard
          keep_files: true
