name: REST Assured API Pipeline

on:
  push:
    branches: [main]
    paths:
      - "projects-tests/rest-assured-api/**"
      - "server-ts/**"
      - "docker-compose.yml"
      - "tests-dashboard/**"
      - ".github/workflows/rest-assured-api-pipeline.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  checks: write

jobs:
  rest-assured-api:
    name: REST Assured API
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23
          cache: maven
          cache-dependency-path: projects-tests/rest-assured-api/pom.xml

      - name: Create test .env
        working-directory: projects-tests/rest-assured-api
        run: |
          cat > .env <<'EOF'
          BASE_URI=http://127.0.0.1:3001
          BASE_PATH=/api
          SEED_ADMIN_EMAIL=reiload@gmail.com
          SEED_ADMIN_PASSWORD=rei2026@QA
          SEED_SUPPORT_EMAIL=suporte@tester.com
          SEED_SUPPORT_PASSWORD=suporte2026@QA
          EOF

      - name: Start backend stack (postgres + server-ts)
        run: docker compose up -d --build postgres server-ts

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3001/api/products > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time"
          exit 1

      - name: Run REST Assured tests
        working-directory: projects-tests/rest-assured-api
        continue-on-error: true
        run: |
          chmod +x mvnw
          ./mvnw clean test \
            -DbaseUri=http://127.0.0.1:3001 \
            -DbasePath=/api

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline@2.34.0

      - name: Generate Allure report
        if: always()
        working-directory: projects-tests/rest-assured-api
        run: allure generate ./allure-results -o ./allure-report --clean
        continue-on-error: true

      - name: Copy reports to tests-dashboard
        if: always()
        run: |
          mkdir -p tests-dashboard/reports/rest-assured-allure-report
          mkdir -p tests-dashboard/reports/api-rest-assured
          rm -rf tests-dashboard/reports/rest-assured-allure-report/*
          rm -rf tests-dashboard/reports/api-rest-assured/*
          if [ -d projects-tests/rest-assured-api/allure-report ]; then
            cp -R projects-tests/rest-assured-api/allure-report/. tests-dashboard/reports/rest-assured-allure-report/
          fi
          if [ -d projects-tests/rest-assured-api/target/surefire-reports ]; then
            cp projects-tests/rest-assured-api/target/surefire-reports/*.xml tests-dashboard/reports/api-rest-assured/ 2>/dev/null || true
          fi

      - name: Publish Allure report to gh-pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: projects-tests/rest-assured-api/allure-report
          destination_dir: tests-dashboard/reports/rest-assured-allure-report
          keep_files: true

      - name: Publish JUnit reports to gh-pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: tests-dashboard/reports/api-rest-assured
          destination_dir: tests-dashboard/reports/api-rest-assured
          keep_files: true

      - uses: actions/setup-node@v4
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: 22

      - name: Restore history from gh-pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git fetch origin gh-pages --depth=1 || true
          git checkout origin/gh-pages -- tests-dashboard/reports/history || echo "No previous history found on gh-pages."

      - name: Generate dashboard metrics
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node ./tests-dashboard/generate-dashboard-metrics.js || true

      - name: Publish dashboard metrics to gh-pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: tests-dashboard/reports
          destination_dir: tests-dashboard/reports
          keep_files: true

      - name: Stop backend stack
        if: always()
        run: docker compose down
