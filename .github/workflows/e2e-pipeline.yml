name: E2E Pipeline

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: write
  pages: write
  id-token: write
  checks: write

jobs:
  # ── Unit Tests ──────────────────────────────────────────────────────
  unit:
    name: Unit Tests (Web & Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web unit tests
        working-directory: web
        continue-on-error: true
        run: |
          npm install
          npx vitest run --coverage \
            --reporter=default --reporter=junit \
            --outputFile=./tests-dashboard/unit-tests-web/junit.xml

      - name: Backend unit tests (DB via Docker Compose)
        continue-on-error: true
        run: |
          docker compose up -d postgres
          docker compose exec -T postgres sh -c 'until pg_isready -U postgres -d ecommerce; do sleep 1; done'
          cd server-ts && npm install
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ecommerce \
            npx vitest run --config vitest.server.config.ts \
              --reporter=default --reporter=junit \
              --outputFile=./tests-dashboard/unit-tests-backend/junit.xml
          docker compose down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report-web
          path: ./tests-dashboard/unit-tests-web/junit.xml
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report-backend
          path: ./tests-dashboard/unit-tests-backend/junit.xml
          if-no-files-found: warn

  # ── Contract Tests ──────────────────────────────────────────────────
  contract:
    name: Contract Tests (Pact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run Pact tests (DB via Docker Compose)
        run: |
          docker compose up -d postgres
          docker compose exec -T postgres sh -c 'until pg_isready -U postgres -d ecommerce; do sleep 1; done'
          cd server-ts && npm install
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ecommerce npm run seed
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ecommerce npm run test:pact
          cd ../web && npm install && npm run test:pact:consumer
          docker compose down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pact-artifacts
          path: |
            pacts
            web/pacts
          if-no-files-found: warn

  # ── E2E Tests (usando docker-compose.yml completo) ──────────────────
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: { project: [frontend-chromium, frontend-edge, api] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install Playwright
        working-directory: web
        run: npm install && npx playwright install --with-deps

      - name: Start stack (docker-compose.yml)
        run: docker compose up -d --build

      - name: Wait for Backend readiness
        working-directory: web
        run: npx wait-on --timeout 60000 http://127.0.0.1:3001/api/products

      - name: Wait for Frontend readiness
        working-directory: web
        run: npx wait-on --timeout 60000 http://127.0.0.1:5174

      - name: Run E2E tests
        working-directory: web
        continue-on-error: true
        run: xvfb-run --auto-servernum npx playwright test --project=${{ matrix.project }}

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --tail=80

      - name: Stop stack
        if: always()
        run: docker compose down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: web/playwright-report
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-junit-${{ matrix.project }}
          path: web/junit-report.xml
          if-no-files-found: warn

  # ── Deploy Reports ──────────────────────────────────────────────────
  deploy:
    name: Deploy Reports
    needs: [unit, contract, e2e]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: tests-dashboard }

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Build report bundle
        run: |
          mkdir -p tests-dashboard/swagger
          cp -r docs/swagger/* tests-dashboard/swagger/ || true
          # Copia relatórios de cobertura e junit do web
          if [ -d web/unit-tests-web ]; then cp -r web/unit-tests-web tests-dashboard/; fi
          if [ -d web/unit-test-report-web ]; then cp -r web/unit-test-report-web tests-dashboard/; fi
          if [ -d web/coverage ]; then cp -r web/coverage tests-dashboard/unit-tests-web/; fi
          # Copia relatórios de cobertura e junit do backend
          if [ -d server-ts/unit-tests-backend ]; then cp -r server-ts/unit-tests-backend tests-dashboard/; fi
          if [ -d server-ts/unit-test-report-backend ]; then cp -r server-ts/unit-test-report-backend tests-dashboard/; fi
          # Copia relatórios E2E
          if [ -d web/playwright-report-frontend-chromium ]; then cp -r web/playwright-report-frontend-chromium tests-dashboard/; fi
          if [ -d web/playwright-report-frontend-edge ]; then cp -r web/playwright-report-frontend-edge tests-dashboard/; fi
          if [ -d web/playwright-report-api ]; then cp -r web/playwright-report-api tests-dashboard/; fi
          # Copia outros relatórios relevantes
          if [ -d web/pacts ]; then cp -r web/pacts tests-dashboard/; fi
          if [ -d pacts ]; then cp -r pacts tests-dashboard/; fi
          cp -r tests-dashboard/* tests-dashboard/  || true

      - uses: peaceiris/actions-gh-pages@v4
        id: deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: tests-dashboard
          publish_branch: gh-pages
          destination_dir: tests-dashboard
          keep_files: true
