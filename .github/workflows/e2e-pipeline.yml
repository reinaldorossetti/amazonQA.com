name: E2E Pipeline

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: write
  pages: write
  id-token: write
  checks: write

concurrency:
  group: gh-pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # ── Unit Tests ──────────────────────────────────────────────────────
  unit:
    name: Unit Tests (Web & Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web unit tests
        working-directory: web
        continue-on-error: true
        run: |
          rm -rf ../tests-dashboard/reports/unit-tests-web
          mkdir -p ../tests-dashboard/reports/unit-tests-web/coverage
          npm install
          npx vitest run --coverage.enabled=true \
            --coverage.reportsDirectory=../tests-dashboard/reports/unit-tests-web/coverage \
            --reporter=default --reporter=junit \
            --outputFile=../tests-dashboard/reports/unit-tests-web/junit.xml

      - name: Backend unit tests (DB via Docker Compose)
        continue-on-error: true
        run: |
          docker compose up -d postgres
          docker compose exec -T postgres sh -c 'until pg_isready -U postgres -d ecommerce; do sleep 1; done'
          cd server-ts && npm install
          rm -rf ../tests-dashboard/reports/unit-tests-backend
          mkdir -p ../tests-dashboard/reports/unit-tests-backend/coverage
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ecommerce \
            npx vitest run --config vitest.server.config.ts --coverage.enabled=true \
            --coverage.reportsDirectory=../tests-dashboard/reports/unit-tests-backend/coverage \
            --reporter=default --reporter=junit \
            --outputFile=../tests-dashboard/reports/unit-tests-backend/junit.xml
          docker compose down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-web
          path: tests-dashboard/reports/unit-tests-web/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-backend
          path: tests-dashboard/reports/unit-tests-backend/
          if-no-files-found: warn

  # ── Contract Tests ──────────────────────────────────────────────────
  contract:
    name: Contract Tests (Pact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run Pact tests (DB via Docker Compose)
        run: |
          docker compose up -d postgres
          docker compose exec -T postgres sh -c 'until pg_isready -U postgres -d ecommerce; do sleep 1; done'
          cd server-ts && npm install
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ecommerce npm run seed
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ecommerce npm run test:pact
          cd ../web && npm install && npm run test:pact:consumer
          docker compose down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-tests
          path: |
            pacts
            web/pacts
          if-no-files-found: warn

  # ── E2E Tests ───────────────────────────────────────────────────────
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: { project: [frontend-chromium, frontend-webkit, frontend-edge, api] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Playwright
        working-directory: web
        run: npm install && npx playwright install --with-deps

      - name: Start stack (docker-compose.yml)
        run: docker compose up -d --build

      - name: Wait for Backend readiness
        working-directory: web
        run: npx wait-on --timeout 60000 http://127.0.0.1:3001/api/products

      - name: Wait for Frontend readiness
        working-directory: web
        run: npx wait-on --timeout 60000 http://127.0.0.1:5174

      - name: Run E2E tests
        working-directory: web
        continue-on-error: true
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit-report.xml
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce
        run: |
          xvfb-run --auto-servernum npx playwright test --project=${{ matrix.project }}

      - name: Container logs (on failure)
        if: failure()
        run: |
          echo "=== Docker Compose Logs ==="
          docker compose logs --tail=100
          echo "=== End of Logs ==="

      - name: Stop stack
        if: always()
        run: docker compose down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: web/playwright-report
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-junit-${{ matrix.project }}
          path: web/junit-report.xml
          if-no-files-found: warn

  # ── Deploy Reports ──────────────────────────────────────────────────
  deploy:
    name: Deploy Reports
    needs: [unit, contract, e2e]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: tests-dashboard/reports

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build report bundle
        run: |
          mkdir -p tests-dashboard/swagger
          if [ -d docs/swagger ]; then cp -r docs/swagger/* tests-dashboard/swagger/ || true; fi

      - name: Restore history from gh-pages
        if: always()
        continue-on-error: true
        run: |
          echo "Fetching previous history from gh-pages branch..."
          git fetch origin gh-pages --depth=1
          git checkout origin/gh-pages -- tests-dashboard/reports/history || echo "No previous history found on gh-pages."
          ls -R tests-dashboard/reports/history || true

      - name: Generate dashboard metrics (with qaEfficiency)
        if: always()
        run: |
          echo "Running dashboard generator..."
          node ./tests-dashboard/generate-dashboard-metrics.js || true

      - name: Show generated files
        if: always()
        run: |
          ls -la tests-dashboard || true
          ls -la tests-dashboard/reports/history || true
          echo '--- latest-scan.json ---'
          cat tests-dashboard/reports/history/latest-scan.json || true
          echo '--- qaEfficiency snapshot (latest) ---'
          LATEST=$(ls tests-dashboard/reports/history/*.json 2>/dev/null | sort -r | head -n1)
          if [ -n "$LATEST" ]; then
            node -e "
              const d = require('./' + process.argv[1]);
              console.log(JSON.stringify(d.qaEfficiency, null, 2));
            " "$LATEST" || true
          fi

      - uses: peaceiris/actions-gh-pages@v4
        id: deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: tests-dashboard
          publish_branch: gh-pages
          destination_dir: tests-dashboard
          keep_files: true
