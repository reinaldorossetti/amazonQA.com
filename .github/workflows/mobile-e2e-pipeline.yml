name: Mobile E2E Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'mobile-kotlin/**'
  pull_request:
    branches: [main]
    paths:
      - 'mobile-kotlin/**'

permissions:
  contents: write
  pages: write
  id-token: write
  checks: write

jobs:
  mobile-e2e-android:
    name: Mobile E2E (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22
          cache: gradle

      - name: Start Backend Stack (Docker Compose)
        run: |
          docker compose up -d postgres server-ts
          # Wait for backend readiness
          timeout 60s bash -c 'until curl -fsS http://localhost:3001/api/products; do sleep 2; done'

      - name: Run Unit Tests (Robolectric)
        working-directory: mobile-kotlin
        run: ./gradlew :androidApp:testDebugUnitTest --continue

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented Tests (Espresso)
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb reverse tcp:3001 tcp:3001 || true
            cd mobile-kotlin
            ./gradlew :androidApp:connectedDebugAndroidTest --continue

      - name: Prepare Test Results for Dashboard
        if: always()
        run: |
          mkdir -p tests-dashboard/e2e-junit-mobile-android
          # Collect Unit Tests results
          cp mobile-kotlin/androidApp/build/test-results/testDebugUnitTest/*.xml tests-dashboard/e2e-junit-mobile-android/ 2>/dev/null || true
          # Collect Instrumented Tests results
          cp mobile-kotlin/androidApp/build/outputs/androidTest-results/connected/*.xml tests-dashboard/e2e-junit-mobile-android/ 2>/dev/null || true
          # Rename if they have generic names to avoid collisions (though they usually are unique)
          ls -R tests-dashboard/e2e-junit-mobile-android/

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-mobile-android
          path: tests-dashboard/e2e-junit-mobile-android/
          if-no-files-found: warn

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: mobile-kotlin/androidApp/build/reports/screenshots/
          if-no-files-found: ignore

      - name: Stop Backend Stack
        if: always()
        run: docker compose down

  deploy-dashboard:
    name: Deploy Dashboard
    needs: [mobile-e2e-android]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: tests-dashboard

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build report bundle
        run: |
          mkdir -p tests-dashboard/swagger
          if [ -d docs/swagger ]; then cp -r docs/swagger/* tests-dashboard/swagger/ || true; fi

      - name: Restore history from gh-pages
        if: always()
        continue-on-error: true
        run: |
          git fetch origin gh-pages --depth=1
          git checkout origin/gh-pages -- tests-dashboard/history || echo "No previous history found."

      - name: Generate dashboard metrics
        if: always()
        run: |
          node ./tests-dashboard/generate-dashboard-metrics.js || true

      - uses: peaceiris/actions-gh-pages@v4
        id: deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: tests-dashboard
          publish_branch: gh-pages
          destination_dir: tests-dashboard
          keep_files: true
